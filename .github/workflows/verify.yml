name: Verify CCE-MVM source candidate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record exact Python version
        run: python --version
      - name: Run source tests
        run: python -m unittest discover -v -s cce -p 'test_*.py'
      - name: Run release and publication-gate tests
        run: >-
          python -m unittest -v
          cce.tools.test_build_reproducibility_package_archive
          cce.tools.test_verify_public_release
          cce.tools.test_build_public_reproducibility_package

  package-smoke:
    name: Build and verify isolated package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build outside the source worktree
        shell: bash
        run: >-
          python cce/tools/build_reproducibility_package.py
          --output-dir "$RUNNER_TEMP/cce-package"
          --archive-path "$RUNNER_TEMP/cce-package.tar.gz"
      - name: Verify generated package
        working-directory: ${{ runner.temp }}/cce-package
        run: python verify_package.py
